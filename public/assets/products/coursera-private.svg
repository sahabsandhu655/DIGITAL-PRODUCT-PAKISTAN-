<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="courseraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2"/>
      <stop offset="100%" stop-color="#002D72"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#080F0D"/>
  <rect x="20" y="20" width="360" height="260" rx="16" fill="#111C18" stroke="#1D2E27" stroke-width="2"/>
  
  <!-- Coursera Geometric Diamond Logo -->
  <g transform="translate(150, 60)">
    <rect width="100" height="100" rx="24" fill="url(#courseraGrad)"/>
    <path d="M50 25 L75 50 L50 75 L25 50 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="50" cy="50" r="14" fill="#0056D2"/>
  </g>
  <rect x="245" y="60" width="90" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="290" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">4M Warranty</text>

  <!-- Typography -->
  <text x="200" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Coursera Private Plan</text>
  <text x="200" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF" text-anchor="middle">Private Mail • Certificates &amp; Specializations</text>
  
  <rect x="135" y="240" width="130" height="28" rx="14" fill="#B7F34A"/>
  <text x="200" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#080F0D" text-anchor="middle">Rs. 4,500 PKR</text>
</svg>

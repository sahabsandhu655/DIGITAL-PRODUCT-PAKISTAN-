<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C" />
      <stop offset="50%" stop-color="#122442" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="msBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#005A9E" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#msBg)" />
  <circle cx="400" cy="190" r="170" fill="#0078D4" opacity="0.1" filter="blur(40px)" />

  <!-- Microsoft 365 4-Tile / Hexagon Suite -->
  <g transform="translate(400, 185) scale(1.1)">
    <!-- Word, Excel, PowerPoint, OneDrive 4 Apps Matrix -->
    <!-- Word (Blue) -->
    <rect x="-65" y="-65" width="55" height="55" rx="14" fill="#2B579A" />
    <text x="-37" y="-28" font-family="sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">W</text>
    
    <!-- Excel (Green) -->
    <rect x="10" y="-65" width="55" height="55" rx="14" fill="#107C41" />
    <text x="37" y="-28" font-family="sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">X</text>
    
    <!-- PowerPoint (Orange/Red) -->
    <rect x="-65" y="10" width="55" height="55" rx="14" fill="#D83B01" />
    <text x="-37" y="47" font-family="sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">P</text>
    
    <!-- OneDrive / Cloud (Cyan/Blue) -->
    <rect x="10" y="10" width="55" height="55" rx="14" fill="#0078D4" />
    <text x="37" y="47" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">1TB</text>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    Microsoft 365 <tspan fill="#0078D4">12-Month</tspan>
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Official 1-Year Subscription • Word, Excel, PowerPoint + 1TB Cloud OneDrive
  </text>

  <!-- Badges -->
  <g transform="translate(400, 425)">
    <rect x="-190" y="-18" width="115" height="32" rx="16" fill="#102540" stroke="#0078D4" stroke-width="1.5" />
    <text x="-132" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#0078D4" text-anchor="middle">1TB ONEDRIVE</text>
    
    <rect x="-60" y="-18" width="125" height="32" rx="16" fill="#102540" stroke="#0078D4" stroke-width="1.5" />
    <text x="2" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1,174 PKR / YEAR</text>
    
    <rect x="80" y="-18" width="115" height="32" rx="16" fill="#102540" stroke="#0078D4" stroke-width="1.5" />
    <text x="137" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#0078D4" text-anchor="middle">12 MONTH ACCESS</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="notionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E" />
      <stop offset="50%" stop-color="#202020" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#notionBg)" />
  <circle cx="400" cy="190" r="170" fill="#FFFFFF" opacity="0.04" filter="blur(40px)" />

  <!-- Notion Iconic 'N' Block -->
  <g transform="translate(400, 185) scale(1.15)">
    <!-- Base Icon Box -->
    <rect x="-65" y="-65" width="130" height="130" rx="30" fill="#181818" stroke="#383838" stroke-width="2" />
    
    <!-- Isometric Cube Notion 'N' -->
    <path d="M -30 -30 L 15 -35 L 35 -15 L 35 35 L -10 40 L -30 20 Z" fill="#252525" />
    <path d="M -20 -15 L -20 25 L -5 25 L -5 -5 L 15 25 L 25 25 L 25 -15 L 10 -15 L 10 15 L -10 -15 Z" fill="#FFFFFF" />
    
    <!-- Plus Badge -->
    <rect x="25" y="-55" width="45" height="22" rx="11" fill="#FFFFFF" />
    <text x="47" y="-40" font-family="sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">PLUS</text>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    Notion <tspan fill="#FFFFFF">Plus</tspan> (12-Month Plan)
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Unlimited Blocks & File Uploads • Database Relations • AI Integration Ready
  </text>

  <!-- Badges -->
  <g transform="translate(400, 425)">
    <rect x="-190" y="-18" width="115" height="32" rx="16" fill="#222222" stroke="#444444" stroke-width="1.5" />
    <text x="-132" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">UNLIMITED BLOCKS</text>
    
    <rect x="-60" y="-18" width="125" height="32" rx="16" fill="#222222" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="2" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#B7F34A" text-anchor="middle">1,443 PKR / YEAR</text>
    
    <rect x="80" y="-18" width="115" height="32" rx="16" fill="#222222" stroke="#444444" stroke-width="1.5" />
    <text x="137" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRIVATE ACCESS</text>
  </g>
</svg>

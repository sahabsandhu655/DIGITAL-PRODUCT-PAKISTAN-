<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="geminiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101E" />
      <stop offset="50%" stop-color="#1A244D" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>
    <linearGradient id="geminiStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E82EE" />
      <stop offset="35%" stop-color="#9B72CF" />
      <stop offset="70%" stop-color="#D96570" />
      <stop offset="100%" stop-color="#F49A52" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#geminiBg)" />
  <circle cx="400" cy="200" r="180" fill="#4E82EE" opacity="0.1" filter="blur(40px)" />

  <!-- Google Gemini 4-Point Star Emblem -->
  <g transform="translate(400, 190) scale(1.1)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="80" fill="url(#geminiStar)" opacity="0.12" />
    <!-- 4-point hyper-curve spark -->
    <path d="M 0 -85 Q 0 0 85 0 Q 0 0 0 85 Q 0 0 -85 0 Q 0 0 0 -85 Z" fill="url(#geminiStar)" />
    <!-- Secondary inner flare -->
    <path d="M 0 -45 Q 0 0 45 0 Q 0 0 0 45 Q 0 0 -45 0 Q 0 0 0 -45 Z" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    Google <tspan fill="#4E82EE">Gemini</tspan> <tspan fill="#9B72CF">Pro</tspan>
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Official Multimodal AI • 1M+ Context Window • Google Workspace
  </text>

  <!-- Badges -->
  <g transform="translate(400, 425)">
    <rect x="-190" y="-18" width="115" height="32" rx="16" fill="#141E3A" stroke="#4E82EE" stroke-width="1.5" />
    <text x="-132" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#4E82EE" text-anchor="middle">1M+ TOKENS CONTEXT</text>
    
    <rect x="-60" y="-18" width="125" height="32" rx="16" fill="#141E3A" stroke="#4E82EE" stroke-width="1.5" />
    <text x="2" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#9B72CF" text-anchor="middle">999 PKR / MONTH</text>
    
    <rect x="80" y="-18" width="115" height="32" rx="16" fill="#141E3A" stroke="#4E82EE" stroke-width="1.5" />
    <text x="137" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#D96570" text-anchor="middle">DIRECT WHATSAPP</text>
  </g>
</svg>

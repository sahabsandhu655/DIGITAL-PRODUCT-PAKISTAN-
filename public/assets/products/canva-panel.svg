<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="canvaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051419" />
      <stop offset="50%" stop-color="#0E2F38" />
      <stop offset="100%" stop-color="#030A0D" />
    </linearGradient>
    <linearGradient id="canvaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC" />
      <stop offset="100%" stop-color="#7D2AE8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#canvaBg)" />
  <circle cx="400" cy="190" r="170" fill="#00C4CC" opacity="0.1" filter="blur(40px)" />

  <!-- Canva Script & Panel Reseller Dashboard Graphic -->
  <g transform="translate(400, 185) scale(1.1)">
    <!-- Base Icon Box -->
    <rect x="-80" y="-70" width="160" height="140" rx="36" fill="#0A2229" stroke="url(#canvaGrad)" stroke-width="3" />
    
    <!-- Canva Iconic C script -->
    <text x="-15" y="10" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="64" font-weight="900" fill="url(#canvaGrad)" text-anchor="middle">Canva</text>
    
    <!-- Admin Shield & 500 Users Badge -->
    <rect x="-65" y="32" width="130" height="26" rx="13" fill="url(#canvaGrad)" />
    <text x="0" y="49" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">500 USERS • 3 YR WARRANTY</text>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    Canva Panel <tspan fill="#00C4CC">3-Years</tspan> (500 Users)
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Full Administrator Reseller Panel • 500 Student/Client Invites • 3-Year Replacement Guarantee
  </text>

  <!-- Badges -->
  <g transform="translate(400, 425)">
    <rect x="-190" y="-18" width="115" height="32" rx="16" fill="#0E2830" stroke="#00C4CC" stroke-width="1.5" />
    <text x="-132" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#00C4CC" text-anchor="middle">500 USER SEATS</text>
    
    <rect x="-60" y="-18" width="130" height="32" rx="16" fill="#0E2830" stroke="#00C4CC" stroke-width="1.5" />
    <text x="5" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2,999 PKR (3 YEARS)</text>
    
    <rect x="85" y="-18" width="115" height="32" rx="16" fill="#0E2830" stroke="#00C4CC" stroke-width="1.5" />
    <text x="142" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#7D2AE8" text-anchor="middle">ADMIN CONTROLS</text>
  </g>
</svg>

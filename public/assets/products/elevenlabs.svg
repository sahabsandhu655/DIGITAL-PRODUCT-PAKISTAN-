<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="elevenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="50%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#elevenBg)" />
  <circle cx="400" cy="180" r="160" fill="#FFFFFF" opacity="0.04" filter="blur(40px)" />

  <!-- ElevenLabs Iconic Dual Vertical Slash Bars & Waveform -->
  <g transform="translate(400, 180) scale(1.15)">
    <!-- Iconic 11 dual bars -->
    <rect x="-24" y="-45" width="16" height="90" rx="8" fill="#FFFFFF" />
    <rect x="8" y="-45" width="16" height="90" rx="8" fill="#FFFFFF" />
    
    <!-- Audio Waveform Lines -->
    <g stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="-70" y1="0" x2="-70" y2="0" />
      <line x1="-55" y1="-15" x2="-55" y2="15" />
      <line x1="-40" y1="-30" x2="-40" y2="30" />
      <line x1="40" y1="-30" x2="40" y2="30" />
      <line x1="55" y1="-15" x2="55" y2="15" />
      <line x1="70" y1="0" x2="70" y2="0" />
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ElevenLabs <tspan fill="#B7F34A">AI Voice</tspan>
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
    100,000 Credits (1 Lakh) • Ultra-Realistic Voice Cloning & Multilingual TTS
  </text>

  <!-- Badges -->
  <g transform="translate(400, 425)">
    <rect x="-190" y="-18" width="115" height="32" rx="16" fill="#1C1E26" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="-132" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">100K CREDITS</text>
    
    <rect x="-60" y="-18" width="125" height="32" rx="16" fill="#1C1E26" stroke="#B7F34A" stroke-width="1.5" />
    <text x="2" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#B7F34A" text-anchor="middle">500 PKR ONLY</text>
    
    <rect x="80" y="-18" width="115" height="32" rx="16" fill="#1C1E26" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="137" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">INSTANT CREDIT</text>
  </g>
</svg>

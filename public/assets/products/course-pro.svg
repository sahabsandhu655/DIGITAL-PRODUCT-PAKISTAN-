<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="courseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#1E163B" />
      <stop offset="100%" stop-color="#0B0914" />
    </linearGradient>
    <linearGradient id="courseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#courseBg)" />
  <circle cx="400" cy="180" r="160" fill="#6366F1" opacity="0.12" filter="blur(50px)" />

  <!-- Center Graphic: Graduation Cap & Book & Play -->
  <g transform="translate(400, 175) scale(1.15)">
    <!-- Base Glow Circle -->
    <circle cx="0" cy="0" r="68" fill="#13122B" stroke="url(#courseGrad)" stroke-width="3" />
    
    <!-- Graduation Cap -->
    <path d="M 0 -34 L 44 -14 L 0 6 L -44 -14 Z" fill="url(#courseGrad)" />
    <path d="M -26 -3 L -26 18 C -26 30 26 30 26 18 L 26 -3" fill="#0E0D22" stroke="url(#courseGrad)" stroke-width="2.5" />
    <!-- Tassel -->
    <path d="M 28 -10 L 38 12 L 34 16 L 38 12" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="36" cy="17" r="3.5" fill="url(#goldGrad)" />
    
    <!-- Play symbol in center -->
    <polygon points="-8,4 12,15 -8,26" fill="url(#goldGrad)" />

    <!-- 1 Year Pro Badge -->
    <rect x="-42" y="44" width="84" height="22" rx="11" fill="url(#goldGrad)" />
    <text x="0" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#0B0914" text-anchor="middle">1 YEAR PRO</text>
  </g>

  <!-- Title & Meta -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    Course Pro <tspan fill="#A855F7">1 Year Access</tspan>
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94A3B8" text-anchor="middle">
    Full Learning Library • Video Lectures • Certificate Included
  </text>

  <!-- Trust Badges -->
  <g transform="translate(400, 430)">
    <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#15132A" stroke="#2F2B59" stroke-width="1.5" />
    <circle cx="-160" cy="0" r="5" fill="#B7F34A" />
    <text x="-145" y="5" font-family="sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Price in Pakistan: Rs. 4,000 PKR</text>
    <text x="75" y="5" font-family="sans-serif" font-size="12" font-weight="800" fill="#B7F34A">12 Months Full Access</text>
  </g>
</svg>

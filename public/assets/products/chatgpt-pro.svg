<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1310" />
      <stop offset="50%" stop-color="#10A37F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#060A08" />
    </linearGradient>
    <linearGradient id="openaiGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10A37F" />
      <stop offset="100%" stop-color="#1A7F64" />
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B7F34A" />
      <stop offset="100%" stop-color="#86C227" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="400" cy="220" r="180" fill="#10A37F" opacity="0.08" filter="blur(40px)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- OpenAI Swirl Logo -->
  <g transform="translate(400, 190) scale(1.15)">
    <!-- Central Hexagonal OpenAI Vortex -->
    <circle cx="0" cy="0" r="75" fill="#10A37F" opacity="0.15" />
    <path d="M 0 -60 C 25 -60 45 -45 52 -20 L 52 10 L 35 0 L 35 -20 C 35 -35 20 -45 0 -45 C -20 -45 -35 -35 -35 -20 L -35 -10 L -52 0 L -52 -20 C -45 -45 -25 -60 0 -60 Z" fill="#10A37F" transform="rotate(0)" />
    <path d="M 0 -60 C 25 -60 45 -45 52 -20 L 52 10 L 35 0 L 35 -20 C 35 -35 20 -45 0 -45 C -20 -45 -35 -35 -35 -20 L -35 -10 L -52 0 L -52 -20 C -45 -45 -25 -60 0 -60 Z" fill="#10A37F" transform="rotate(60)" />
    <path d="M 0 -60 C 25 -60 45 -45 52 -20 L 52 10 L 35 0 L 35 -20 C 35 -35 20 -45 0 -45 C -20 -45 -35 -35 -35 -20 L -35 -10 L -52 0 L -52 -20 C -45 -45 -25 -60 0 -60 Z" fill="#10A37F" transform="rotate(120)" />
    <path d="M 0 -60 C 25 -60 45 -45 52 -20 L 52 10 L 35 0 L 35 -20 C 35 -35 20 -45 0 -45 C -20 -45 -35 -35 -35 -20 L -35 -10 L -52 0 L -52 -20 C -45 -45 -25 -60 0 -60 Z" fill="#10A37F" transform="rotate(180)" />
    <path d="M 0 -60 C 25 -60 45 -45 52 -20 L 52 10 L 35 0 L 35 -20 C 35 -35 20 -45 0 -45 C -20 -45 -35 -35 -35 -20 L -35 -10 L -52 0 L -52 -20 C -45 -45 -25 -60 0 -60 Z" fill="#10A37F" transform="rotate(240)" />
    <path d="M 0 -60 C 25 -60 45 -45 52 -20 L 52 10 L 35 0 L 35 -20 C 35 -35 20 -45 0 -45 C -20 -45 -35 -35 -35 -20 L -35 -10 L -52 0 L -52 -20 C -45 -45 -25 -60 0 -60 Z" fill="#10A37F" transform="rotate(300)" />
    <!-- White Inner Core -->
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ChatGPT <tspan fill="#10A37F">Pro</tspan>
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Official OpenAI Flagship GPT-4o • Dedicated Speed • Pakistan Access
  </text>

  <!-- Badges -->
  <g transform="translate(400, 425)">
    <rect x="-190" y="-18" width="110" height="32" rx="16" fill="#162A22" stroke="#10A37F" stroke-width="1.5" />
    <text x="-135" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#10A37F" text-anchor="middle">GPT-4o UNLIMITED</text>
    
    <rect x="-65" y="-18" width="130" height="32" rx="16" fill="#162A22" stroke="#10A37F" stroke-width="1.5" />
    <text x="0" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#10A37F" text-anchor="middle">4,000 PKR / MONTH</text>
    
    <rect x="80" y="-18" width="115" height="32" rx="16" fill="#162A22" stroke="#10A37F" stroke-width="1.5" />
    <text x="137" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#10A37F" text-anchor="middle">INSTANT WHATSAPP</text>
  </g>
</svg>

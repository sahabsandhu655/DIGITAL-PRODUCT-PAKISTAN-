<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="waBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08140E" />
      <stop offset="50%" stop-color="#123B25" />
      <stop offset="100%" stop-color="#050B07" />
    </linearGradient>
    <linearGradient id="waGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#waBg)" />
  <circle cx="400" cy="190" r="170" fill="#25D366" opacity="0.1" filter="blur(40px)" />

  <!-- WhatsApp Marketing Dashboard Graphic -->
  <g transform="translate(400, 180)">
    <!-- Dashboard Screen Frame -->
    <rect x="-160" y="-95" width="320" height="180" rx="16" fill="#0C1B14" stroke="#25D366" stroke-width="2" />
    
    <!-- Top Bar -->
    <rect x="-160" y="-95" width="320" height="30" rx="16" fill="#122A1E" />
    <circle cx="-140" cy="-80" r="4" fill="#FF5F56" />
    <circle cx="-125" cy="-80" r="4" fill="#FFBD2E" />
    <circle cx="-110" cy="-80" r="4" fill="#27C93F" />
    <text x="0" y="-76" font-family="sans-serif" font-size="11" font-weight="700" fill="#25D366" text-anchor="middle">WhatsApp Bulk SMS Marketing Studio v8.4</text>
    
    <!-- Dashboard Columns -->
    <rect x="-145" y="-50" width="80" height="120" rx="8" fill="#163828" opacity="0.6" />
    <text x="-105" y="-30" font-family="sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">LEADS IMPORT</text>
    <text x="-105" y="-10" font-family="sans-serif" font-size="14" font-weight="800" fill="#25D366" text-anchor="middle">50,000+</text>
    <rect x="-135" y="10" width="60" height="6" rx="3" fill="#25D366" />
    <rect x="-135" y="25" width="45" height="6" rx="3" fill="#10A37F" />
    <rect x="-135" y="40" width="55" height="6" rx="3" fill="#25D366" />
    
    <!-- Center Message Panel -->
    <rect x="-55" y="-50" width="190" height="120" rx="8" fill="#163828" opacity="0.8" />
    <text x="40" y="-30" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Campaign: Pakistani Clients (Urdu/Eng)</text>
    <rect x="-45" y="-18" width="170" height="40" rx="6" fill="#0C1B14" />
    <text x="-35" y="-2" font-family="sans-serif" font-size="9" fill="#25D366">Salam {Name}! Order confirmed via Easypaisa...</text>
    <text x="-35" y="12" font-family="sans-serif" font-size="9" fill="#94A3B8">Anti-ban safe delay active (10s - 15s)</text>
    
    <!-- Send Button Status -->
    <rect x="-45" y="32" width="80" height="24" rx="6" fill="#25D366" />
    <text x="-5" y="48" font-family="sans-serif" font-size="10" font-weight="800" fill="#0C1B14" text-anchor="middle">DISPATCHING</text>
    <text x="75" y="48" font-family="sans-serif" font-size="10" font-weight="700" fill="#25D366">98.4% Delivered</text>

    <!-- Floating Shield Badge -->
    <circle cx="145" cy="50" r="30" fill="#122A1E" stroke="#25D366" stroke-width="2" />
    <text x="145" y="45" font-family="sans-serif" font-size="18" text-anchor="middle">🛡️</text>
    <text x="145" y="62" font-family="sans-serif" font-size="8" font-weight="800" fill="#25D366" text-anchor="middle">ANTI-BAN</text>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    WhatsApp <tspan fill="#25D366">Bulk SMS Sender</tspan> Software
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Windows PC Lifetime License • Excel Importer • Anti-Ban Delays • Group Extractor
  </text>

  <!-- Badges -->
  <g transform="translate(400, 425)">
    <rect x="-190" y="-18" width="115" height="32" rx="16" fill="#122A1E" stroke="#25D366" stroke-width="1.5" />
    <text x="-132" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#25D366" text-anchor="middle">ANTI-BAN SAFE</text>
    
    <rect x="-60" y="-18" width="130" height="32" rx="16" fill="#122A1E" stroke="#25D366" stroke-width="1.5" />
    <text x="5" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2,499 PKR LIFETIME</text>
    
    <rect x="85" y="-18" width="115" height="32" rx="16" fill="#122A1E" stroke="#25D366" stroke-width="1.5" />
    <text x="142" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#25D366" text-anchor="middle">EXCEL CSV IMPORT</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primeBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E18" />
      <stop offset="50%" stop-color="#0F243A" />
      <stop offset="100%" stop-color="#04080D" />
    </linearGradient>
    <linearGradient id="primeCyan1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8E1" />
      <stop offset="100%" stop-color="#0082B0" />
    </linearGradient>
    <linearGradient id="amazonOrange1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#E87900" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#primeBg1)" />
  <circle cx="400" cy="180" r="160" fill="#00A8E1" opacity="0.12" filter="blur(45px)" />

  <!-- Prime Video Icon / Logo Graphic -->
  <g transform="translate(400, 175) scale(1.15)">
    <!-- Base Rounded TV Screen -->
    <rect x="-65" y="-55" width="130" height="96" rx="20" fill="#0B1A2A" stroke="url(#primeCyan1)" stroke-width="3" />
    
    <!-- prime video text -->
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">prime</text>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#00A8E1" text-anchor="middle" letter-spacing="2">VIDEO</text>
    
    <!-- Amazon Smile Arrow -->
    <path d="M -26 22 Q 0 34 26 22" fill="none" stroke="url(#amazonOrange1)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 23 20 L 28 22 L 25 27 Z" fill="url(#amazonOrange1)" />

    <!-- 1 MONTH UHD Badge -->
    <rect x="-54" y="52" width="108" height="22" rx="11" fill="url(#amazonOrange1)" />
    <text x="0" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#050E18" text-anchor="middle">1 MONTH UHD</text>
  </g>

  <!-- Title & Meta -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    Amazon Prime Video <tspan fill="#00A8E1">1 Month</tspan>
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94A3B8" text-anchor="middle">
    4K Ultra HD • Private Screen Profile • Direct WhatsApp Activation
  </text>

  <!-- Price Badge -->
  <g transform="translate(400, 430)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#0C1B2A" stroke="#1B3A57" stroke-width="1.5" />
    <circle cx="-155" cy="0" r="5" fill="#FF9900" />
    <text x="-140" y="5" font-family="sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Price in Pakistan: Rs. 450 PKR</text>
    <text x="75" y="5" font-family="sans-serif" font-size="12" font-weight="800" fill="#00A8E1">1 Month Plan</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="surfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061215" />
      <stop offset="50%" stop-color="#0A2227" />
      <stop offset="100%" stop-color="#04090B" />
    </linearGradient>
    <linearGradient id="surfTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FE8C8" />
      <stop offset="50%" stop-color="#00D3AC" />
      <stop offset="100%" stop-color="#009A7B" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#surfBg)" />
  <circle cx="400" cy="180" r="160" fill="#00D3AC" opacity="0.12" filter="blur(45px)" />

  <!-- Surfshark Fin / Shield -->
  <g transform="translate(400, 175) scale(1.15)">
    <!-- Base Circular Shield -->
    <circle cx="0" cy="0" r="66" fill="#0C2025" stroke="url(#surfTeal)" stroke-width="3" />
    
    <!-- Stylized Shark Fin 'S' curve -->
    <path d="M -15 28 C -15 -10 18 -26 30 -38 C 22 -14 18 10 -2 28 Z" fill="url(#surfTeal)" />
    <path d="M -26 12 C -26 -16 -4 -28 4 -36 C -2 -14 -6 6 -20 18 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Wave lines -->
    <path d="M -34 35 Q 0 42 34 35" stroke="url(#surfTeal)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Private Plan Badge -->
    <rect x="-44" y="52" width="88" height="20" rx="10" fill="url(#surfTeal)" />
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#061215" text-anchor="middle">PRIVATE PLAN</text>
  </g>

  <!-- Title & Meta -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    Surfshark VPN <tspan fill="#1FE8C8">Private Plan</tspan>
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94A3B8" text-anchor="middle">
    3200+ Servers • Unlimited Devices • Zero-Log CleanWeb
  </text>

  <!-- Price Badge -->
  <g transform="translate(400, 430)">
    <rect x="-175" y="-18" width="350" height="36" rx="18" fill="#0C1F23" stroke="#163C42" stroke-width="1.5" />
    <circle cx="-150" cy="0" r="5" fill="#1FE8C8" />
    <text x="-135" y="5" font-family="sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Price in Pakistan: Rs. 500 PKR / mo</text>
    <text x="75" y="5" font-family="sans-serif" font-size="12" font-weight="800" fill="#1FE8C8">Private</text>
  </g>
</svg>

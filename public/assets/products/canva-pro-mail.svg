<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="canvaMailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC"/>
      <stop offset="50%" stop-color="#7D2AE8"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>
    <radialGradient id="canvaMailGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C4CC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#080F0D"/>
  <rect width="400" height="300" fill="url(#canvaMailGlow)"/>
  <rect x="20" y="20" width="360" height="260" rx="16" fill="#111C18" stroke="#1D2E27" stroke-width="2"/>
  
  <!-- Canva Badge & Mail Icon -->
  <circle cx="200" cy="115" r="54" fill="url(#canvaMailBg)"/>
  <!-- Envelope overlay -->
  <path d="M165 95 L200 120 L235 95 Z" fill="#FFFFFF"/>
  <path d="M165 100 L165 135 L235 135 L235 100 L200 125 Z" fill="#F0FDFC"/>
  <circle cx="230" cy="90" r="14" fill="#B7F34A"/>
  <path d="M225 90 L229 94 L236 86" stroke="#0B1310" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Typography -->
  <text x="200" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Canva Pro (On Mail)</text>
  <text x="200" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF" text-anchor="middle">Activated Direct on Your Email • Instant Access</text>
  
  <!-- Price Pill -->
  <rect x="140" y="242" width="120" height="28" rx="14" fill="#B7F34A"/>
  <text x="200" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#080F0D" text-anchor="middle">Rs. 500 PKR</text>
</svg>

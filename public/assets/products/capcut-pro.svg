<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="capcutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0E2338" />
      <stop offset="100%" stop-color="#03060C" />
    </linearGradient>
    <linearGradient id="capcutCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#capcutBg)" />
  <circle cx="400" cy="190" r="170" fill="#00F0FF" opacity="0.08" filter="blur(40px)" />

  <!-- CapCut Pro Scissors / Hourglass Geometry -->
  <g transform="translate(400, 185) scale(1.1)">
    <!-- Base Icon Box -->
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="#0A1828" stroke="url(#capcutCyan)" stroke-width="3" />
    <!-- CapCut stylized geometric cut shapes -->
    <path d="M -40 -25 L 0 10 L 40 -25 L 20 -45 L 0 -25 L -20 -45 Z" fill="#FFFFFF" />
    <path d="M -40 25 L 0 -10 L 40 25 L 20 45 L 0 25 L -20 45 Z" fill="url(#capcutCyan)" />
    <!-- Pro Ribbon -->
    <rect x="25" y="-60" width="55" height="24" rx="12" fill="#00F0FF" />
    <text x="52" y="-44" font-family="sans-serif" font-size="11" font-weight="900" fill="#03060C" text-anchor="middle">PRO</text>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    CapCut <tspan fill="#00F0FF">Pro</tspan> Individual
  </text>
  
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
    4K 60FPS Video Export • Auto-Captions • Premium Pro Effects & Transitions
  </text>

  <!-- Badges -->
  <g transform="translate(400, 425)">
    <rect x="-190" y="-18" width="115" height="32" rx="16" fill="#0D2235" stroke="#00F0FF" stroke-width="1.5" />
    <text x="-132" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#00F0FF" text-anchor="middle">4K 60FPS EXPORT</text>
    
    <rect x="-60" y="-18" width="125" height="32" rx="16" fill="#0D2235" stroke="#00F0FF" stroke-width="1.5" />
    <text x="2" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">750 PKR / MONTH</text>
    
    <rect x="80" y="-18" width="115" height="32" rx="16" fill="#0D2235" stroke="#00F0FF" stroke-width="1.5" />
    <text x="137" y="3" font-family="sans-serif" font-size="12" font-weight="700" fill="#00F0FF" text-anchor="middle">FULL PRO ACCESS</text>
  </g>
</svg>

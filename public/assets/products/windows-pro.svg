<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A4EF"/>
      <stop offset="100%" stop-color="#0078D7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#080F0D"/>
  <rect x="20" y="20" width="360" height="260" rx="16" fill="#111C18" stroke="#1D2E27" stroke-width="2"/>
  
  <!-- Windows 4-Square Flag Logo -->
  <g transform="translate(150, 60)">
    <rect width="100" height="100" rx="20" fill="url(#winGrad)"/>
    <!-- Windows 4 squares tilted -->
    <path d="M28 32 L47 29 L47 48 L28 48 Z" fill="#FFFFFF"/>
    <path d="M53 28 L74 25 L74 48 L53 48 Z" fill="#FFFFFF"/>
    <path d="M28 52 L47 52 L47 71 L28 68 Z" fill="#FFFFFF"/>
    <path d="M53 52 L74 52 L74 75 L53 72 Z" fill="#FFFFFF"/>
  </g>
  <rect x="245" y="60" width="90" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="290" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">Lifetime Key</text>

  <!-- Typography -->
  <text x="200" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Windows 10/11 Pro License</text>
  <text x="200" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF" text-anchor="middle">Retail Activation Key • 1 PC • Lifetime Updates</text>
  
  <rect x="140" y="240" width="120" height="28" rx="14" fill="#B7F34A"/>
  <text x="200" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#080F0D" text-anchor="middle">Rs. 650 PKR</text>
</svg>
